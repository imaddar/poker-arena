name: Local Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poker_arena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d poker_arena"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/engine/go.mod
          cache-dependency-path: services/engine/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend/web ci

      - name: Run backend API tests
        run: go -C services/engine test ./internal/api

      - name: Run frontend logic tests
        run: npm --prefix frontend/web run test:logic

      - name: Run frontend build
        run: npm --prefix frontend/web run build

      - name: Run backend auth + smoke scripts
        env:
          CONTROLPLANE_ADMIN_TOKENS: local-admin-token
          CONTROLPLANE_SEAT_TOKENS: 1:local-seat-1-token,2:local-seat-2-token
          AGENT_ENDPOINT_ALLOWLIST: 127.0.0.1:9001,127.0.0.1:9002
          CONTROLPLANE_CORS_ALLOWED_ORIGINS: http://localhost:5173
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/poker_arena?sslmode=disable
          BASE_URL: http://127.0.0.1:8081
          ADMIN_TOKEN: local-admin-token
          SEAT_TOKEN: local-seat-1-token
        run: |
          set -euo pipefail

          go -C services/engine run ./cmd/controlplane -addr :8081 > /tmp/controlplane.log 2>&1 &
          CONTROLPLANE_PID=$!
          cleanup() {
            kill "${CONTROLPLANE_PID}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 40); do
            if curl -sS -o /dev/null "${BASE_URL}/unknown"; then
              break
            fi
            sleep 0.5
          done
          curl -sS -o /dev/null "${BASE_URL}/unknown"

          ./scripts/test-backend-auth-local.sh
          ./scripts/web-smoke-local.sh
